<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Zanaks AI</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-system.css', v='1.3') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth-theme-switcher.css', v='1.3') }}">
  <style>
    :root {
      --void: #020d12;
      --deep: #060d1a;
      --plasma: #00ffe0;
      --plasma-dim: rgba(0, 255, 224, 0.1);
      --plasma-glow: rgba(0, 255, 224, 0.2);
      --nova: #a855f7;
      --fire: #ff6b2b;
      --gold: #fbbf24;
      --text: #e2f4ff;
      --text-2: rgba(226, 244, 255, 0.45);
      --text-3: rgba(226, 244, 255, 0.18);
      --border: rgba(0, 255, 224, 0.08);
      --border-hi: rgba(0, 255, 224, 0.3);
      --surface: rgba(0, 255, 224, 0.03);
      --mono: 'IBM Plex Mono', monospace;
      --display: 'Inter', system-ui, -apple-system, sans-serif;
      --body: 'Inter', system-ui, -apple-system, sans-serif;
      --card-bg: rgba(6, 13, 26, 0.92);
      --logo-bg-outer: rgba(0, 255, 224, 0.03);
      --logo-bg-inner: rgba(6, 13, 26, 0.8);
    }

    body.light {
      --void: #e8f4f8;
      --deep: #d4ecf5;
      --plasma: #0066d6;
      --plasma-dim: rgba(3, 102, 214, 0.15);
      --plasma-glow: rgba(3, 102, 214, 0.3);
      --nova: #5e21b6;
      --fire: #c41e3a;
      --text: #0c2a3a;
      --text-2: rgba(12, 42, 58, 0.65);
      --text-3: rgba(12, 42, 58, 0.45);
      --border: rgba(3, 102, 214, 0.25);
      --border-hi: rgba(3, 102, 214, 0.55);
      --surface: rgba(3, 102, 214, 0.08);
      --card-bg: rgba(255, 255, 255, 0.95);
      --logo-bg-outer: rgba(3, 102, 214, 0.06);
      --logo-bg-inner: #ffffff;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--body);
      background: var(--void);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #neuralCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.4;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.4;
    }

    .forge-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--border-hi);
      border-radius: 2px;
      padding: 42px 40px 36px;
      box-shadow:
        0 0 0 1px rgba(0, 255, 224, 0.04),
        0 24px 80px rgba(0, 0, 0, 0.7),
        0 0 60px rgba(0, 255, 224, 0.06);
    }

    .forge-card::before,
    .forge-card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--plasma);
      border-style: solid;
      opacity: 0.6;
    }

    .forge-card::before {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .forge-card::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }

    .card-scanline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--plasma), var(--nova), transparent);
      background-size: 200% 100%;
      animation: scanMove 3s linear infinite;
      border-radius: 2px 2px 0 0;
    }

    @keyframes scanMove {
      0% {
        background-position: 0% 0
      }

      100% {
        background-position: 200% 0
      }
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-hex {
      width: 56px;
      height: 56px;
      position: relative;
    }

    .logo-hex svg {
      width: 56px;
      height: 56px;
    }

    .logo-hex-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      filter: drop-shadow(0 0 10px var(--plasma));
    }

    .logo-title {
      font-family: var(--display);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--plasma);
      text-shadow: 0 0 30px var(--plasma-glow);
    }

    .logo-sub {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-3);
      text-align: center;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-hi), transparent);
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
      position: relative;
    }

    .field-label {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 7px;
      display: block;
    }

    .field-wrap {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--surface);
      transition: border-color 0.25s, box-shadow 0.25s;
      overflow: hidden;
    }

    .field-wrap:focus-within {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 1px rgba(0, 255, 224, 0.08), 0 0 20px rgba(0, 255, 224, 0.05);
    }

    .field-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      font-size: 14px;
      transition: color 0.2s;
      pointer-events: none;
      z-index: 2;
    }

    .field-wrap:focus-within .field-icon {
      color: var(--plasma);
    }

    .field-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .field-input::placeholder {
      color: var(--text-3);
    }

    .pwd-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-3);
      font-size: 14px;
      transition: color 0.2s;
      padding: 2px;
      z-index: 2;
    }

    .pwd-toggle:hover {
      color: var(--plasma);
    }

    .strength-wrap {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .strength-track {
      height: 3px;
      background: rgba(256, 256, 256, 0.05);
      border-radius: 1px;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .strength-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--text-3);
      text-transform: uppercase;
    }

    .flash-msg {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fire);
      border: 1px solid rgba(255, 107, 43, 0.25);
      background: rgba(255, 107, 43, 0.08);
      padding: 9px 12px;
      border-radius: 2px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .forge-btn {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid var(--border-hi);
      background: var(--plasma-dim);
      color: var(--plasma);
      font-family: var(--display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      transition: all 0.25s;
      box-shadow: 0 0 12px var(--plasma-glow);
    }

    .forge-btn:hover {
      background: rgba(0, 255, 224, 0.15);
      box-shadow: 0 0 28px var(--plasma), inset 0 0 16px var(--plasma-dim);
      border-color: var(--plasma);
    }

    .forge-btn:active {
      transform: scale(0.98);
    }

    .btn-arrow {
      margin-left: 8px;
      transition: transform 0.2s;
      display: inline-block;
    }

    .forge-btn:hover .btn-arrow {
      transform: translateX(4px);
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-family: var(--display);
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-3);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--plasma);
      box-shadow: 0 0 5px var(--plasma);
      animation: blink 1.8s ease infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1 }
      50% { opacity: 0.3 }
    }

    @media (max-width: 520px) {
      html, body { height: auto; min-height: 100%; overflow: auto; }
      body { padding: 20px 10px; }
      .forge-card { padding: 30px 20px 24px; margin: 20px auto; }
    }
  </style>
  <script>
    (function(){
      var t = localStorage.getItem('cb-theme') || 'gaming';
      var valid = ['gaming','darkpro','professional','warm','minimal'];
      if(!valid.includes(t)) t = 'gaming';
      document.documentElement.classList.add('theme-' + t);
    })();
  </script>
</head>

<body>
  <script src="{{ url_for('static', filename='js/theme-system.js', v='1.3') }}"></script>
  <script src="{{ url_for('static', filename='js/auth-theme-switcher.js', v='1.3') }}"></script>

  <canvas id="neuralCanvas"></canvas>

  <div class="forge-card">
    <div class="card-scanline"></div>

    <div class="logo-area">
      <div class="logo-hex">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGradRp" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--plasma)" />
              <stop offset="100%" stop-color="var(--nova)" />
            </linearGradient>
            <linearGradient id="logoGradReverseRp" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="var(--nova)" />
              <stop offset="100%" stop-color="var(--plasma)" />
            </linearGradient>
            <linearGradient id="bevelLightRp" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          <!-- Outer Chamfered Hex Shield -->
          <polygon points="28,3 51,16 51,40 28,53 5,40 5,16" stroke="url(#logoGradRp)" stroke-width="1.6" fill="var(--logo-bg-outer)" />
          <!-- Inner Concentric Orbit Track -->
          <polygon points="28,7 47,18 47,38 28,49 9,38 9,18" stroke="rgba(255,255,255,0.12)" stroke-width="0.9" stroke-dasharray="4 2" fill="none" />
          <!-- Code Caliper Left < -->
          <path d="M 15 24 L 11 28 L 15 32" stroke="var(--plasma)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Code Caliper Right > -->
          <path d="M 41 24 L 45 28 L 41 32" stroke="var(--nova)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <!-- 3D Beveled Z Core -->
          <polygon points="18,17 38,17 34,23 23,23" fill="url(#logoGradRp)" />
          <polygon points="18,17 38,17 36,19 20,19" fill="url(#bevelLightRp)" />
          <polygon points="38,17 24,37 20,37 32,23" fill="url(#logoGradRp)" />
          <polygon points="34,23 26,33 24,37 20,37 28,25" fill="url(#logoGradReverseRp)" opacity="0.85" />
          <line x1="35" y1="19" x2="22" y2="37" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
          <polygon points="23,33 38,33 38,39 18,39" fill="url(#logoGradReverseRp)" />
          <polygon points="23,33 38,33 38,35 24,35" fill="url(#bevelLightRp)" opacity="0.6" />
          <!-- Central Quantum Diamond Reactor -->
          <polygon points="28,25 31,28 28,31 25,28" fill="#ffffff" />
          <circle cx="28" cy="28" r="1.5" fill="var(--plasma)" />
        </svg>
      </div>
      <div class="logo-title">ZANAKS <span style="font-size:12px; padding:2px 6px; border-radius:4px; background:linear-gradient(135deg,var(--plasma),var(--nova)); color:#030712; font-weight:800; letter-spacing:1px; vertical-align:middle; display:inline-block;">AI</span></div>
      <div class="logo-sub">Configure New Access Key</div>
    </div>

    <div class="divider"></div>

    {% if error %}
    <div class="flash-msg">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label class="field-label">Set New Access Key</label>
        <div class="field-wrap">
          <span class="field-icon">⬡</span>
          <input class="field-input" type="password" name="password" placeholder="Enter new password" required id="pwdField"
            oninput="checkStrength(this.value)">
          <button type="button" class="pwd-toggle" onclick="togglePwd()" id="pwdToggle">👁</button>
        </div>
        <div class="strength-wrap">
          <div class="strength-track">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <div class="strength-label" id="strengthLabel">STRENGTH: —</div>
        </div>
      </div>

      <button type="submit" class="forge-btn">
        RESET PASSWORD <span class="btn-arrow">▶</span>
      </button>
    </form>

    <div class="status-line">
      <div class="status-dot"></div>
      ZANAKS AI · SECURITY CONFIGURE
    </div>
  </div>

  <script>
    /* ── PASSWORD TOGGLE ── */
    function togglePwd() {
      const f = document.getElementById('pwdField'), t = document.getElementById('pwdToggle');
      f.type = f.type === 'password' ? 'text' : 'password';
      t.textContent = f.type === 'password' ? '👁' : '🙈';
    }

    /* ── PASSWORD STRENGTH ── */
    function checkStrength(val) {
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { pct: '0%', color: 'transparent', text: 'STRENGTH: —' },
        { pct: '20%', color: 'var(--fire)', text: 'STRENGTH: WEAK' },
        { pct: '45%', color: 'var(--gold)', text: 'STRENGTH: FAIR' },
        { pct: '70%', color: 'rgba(0,255,224,0.7)', text: 'STRENGTH: GOOD' },
        { pct: '85%', color: 'var(--plasma)', text: 'STRENGTH: STRONG' },
        { pct: '100%', color: 'var(--plasma)', text: 'STRENGTH: MAXIMUM ✓' },
      ];
      const l = levels[Math.min(score, 5)];
      fill.style.width = l.pct;
      fill.style.background = l.color;
      label.textContent = l.text;
      label.style.color = score >= 4 ? 'var(--plasma)' : score >= 2 ? 'var(--gold)' : 'var(--fire)';
      if (!val) { fill.style.width = '0%'; label.textContent = 'STRENGTH: —'; label.style.color = 'var(--text-3)'; }
    }

    /* ── NEURAL CANVAS ── */
    (function () {
      const canvas = document.getElementById('neuralCanvas');
      const ctx = canvas.getContext('2d');
      let W, H, nodes = [];
      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      resize(); window.addEventListener('resize', resize);
      class Node {
        constructor() { this.x = Math.random() * W; this.y = Math.random() * H; this.vx = (Math.random() - .5) * .35; this.vy = (Math.random() - .5) * .35; this.r = Math.random() * 1.5 + 0.8; this.p = Math.random() * Math.PI * 2; }
        update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > W) this.vx *= -1; if (this.y < 0 || this.y > H) this.vy *= -1; this.p += 0.02; }
      }
      for (let i = 0; i < 55; i++) nodes.push(new Node());
      let mx = W / 2, my = H / 2;
      document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
      function draw() {
        ctx.clearRect(0, 0, W, H);
        nodes.forEach(n => n.update());
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y, d = Math.sqrt(dx * dx + dy * dy);
            if (d < 130) { ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.strokeStyle = `rgba(0,255,224,${(1 - d / 130) * .22})`; ctx.lineWidth = .5; ctx.stroke(); }
          }
          const dx = nodes[i].x - mx, dy = nodes[i].y - my, d = Math.sqrt(dx * dx + dy * dy);
          if (d < 200) { ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(mx, my); ctx.strokeStyle = `rgba(0,255,224,${(1 - d / 200) * .35})`; ctx.lineWidth = .8; ctx.stroke(); }
        }
        nodes.forEach(n => {
          const g = (Math.sin(n.p) + 1) / 2;
          ctx.beginPath(); ctx.arc(n.x, n.y, n.r * (1 + g * .5), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0,255,224,${.35 + g * .45})`; ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>

</html>
